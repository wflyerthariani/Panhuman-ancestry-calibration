[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ancal"
version = "0.1.0"
description = "AVI ancestry-calibration audit: data-readiness pipeline (Outcome 1)"
requires-python = ">=3.11"

[project.scripts]
ancal = "ancal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
