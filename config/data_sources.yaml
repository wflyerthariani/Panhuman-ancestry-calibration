# Data locations and storage settings.
# See SCALING_UP.md before changing scope or storage.
# URIs were checked on 2026-09-26. Each is fetched and recorded in the manifest
# by the stage that uses it.
# Local copies (2026-10-14): /home/ubuntu/ancal_inputs/ holds correctly named symlinks into
# /home/ubuntu/gv-foundation-model/data/raw/ (the originals have no file extensions) plus the
# ClinVar tabix index. See SCALING_UP.md section 0 and docs/DECISIONS.md D-049.

# smoke | dms_genes | exome
scope: smoke

storage:
  # All data files resolve under this root. Relative paths are relative to the repo.
  root: ./data_store
  # Hard cap on local disk used by data_store/ plus generated outputs.
  local_budget_gb: 1.0
  # Directories (relative to repo) counted against the budget in addition to root.
  counted_output_dirs:
    - tables
    - figures
    - logs
    - reports
    - deliverables
    - resources/regions

review_gates:
  # strict:      Stage 6 is blocked until every in-scope assay in config/dms_curation.tsv has a
  #              reviewer decision (D-035). Required before the config can be frozen.
  # provisional: unreviewed assays use the pipeline's proposed direction (assays whose proposal is
  #              `conflict` or `unknown` are left out). Every output is marked PROVISIONAL.
  dms_review: provisional

scopes:
  smoke:
    # 2-3 DMS-rich genes on one chromosome; the final choice is made in Stage 4
    # against the MaveDB inventory.
    genes: [BRCA1, TP53]
    contigs: [chr17]
  dms_genes:
    genes: from_dms_inventory      # every candidate gene in tables/dms_candidate_inventory.tsv
    contigs: from_genes
  exome:
    genes: all_mane_select
    contigs: all

sources:
  population_vcf:
    name: gnomAD v3.1.2 HGDP+1KG dense callset
    version: v3.1.2
    # Per-chromosome, bgzipped + tabix-indexed (about 100-280 GB each). Always read by region.
    uri: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1.2/vcf/genomes/gnomad.genomes.v3.1.2.hgdp_tgp.{contig}.vcf.bgz
    index_suffix: .tbi
    access: remote_tabix

  sample_metadata:
    name: gnomAD HGDP+1KG sample metadata and QC (v2 release, Koenig et al. 2024)
    # Local copy of the URL below (gsutil log: gv-foundation-model/data/raw/onekg_meta_v2.log).
    # Remote: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/secondary_analyses/hgdp_1kg_v2/metadata_and_qc/gnomad_meta_updated.tsv
    uri: /home/ubuntu/ancal_inputs/gnomad_meta_updated.tsv
    qc_summary_uri: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/secondary_analyses/hgdp_1kg_v2/metadata_and_qc/post_qc_summary.tsv
    # Koenig et al. post-QC sample set = the samples in the global PCA "without outliers"
    # (4,094 samples, 80 populations), with 20 PCs per sample.
    pc_scores_uri: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/secondary_analyses/hgdp_1kg_v2/pca/pc_scores_without_outliers/GLOBAL_scores_without_outliers.txt.bgz
    pca_outliers_uri: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/secondary_analyses/hgdp_1kg_v2/pca/pca_outliers.txt
    # Related samples (Hail Table of 698 IDs), read with ancal.sources.hail_table.
    related_ids_uri: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/secondary_analyses/hgdp_1kg_v2/pca_preprocessing/related_sample_ids.ht
    # Released unrelated / related PCA MatrixTables; only their sample counts are read (cross-check).
    unrelated_mt_uri: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/secondary_analyses/hgdp_1kg_v2/pca_results/unrelateds_without_outliers.mt
    related_mt_uri: https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/secondary_analyses/hgdp_1kg_v2/pca_results/relateds_without_outliers.mt
    access: download   # about 6 MB in total

  reference_fasta:
    name: Broad GRCh38 genome FASTA (Homo_sapiens_assembly38, gs://gcp-public-data--broad-references/hg38/v0)
    # Local whole-genome FASTA with .fai; each in-scope contig is extracted, uppercased and bgzipped.
    # Remote per-contig alternative: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/{contig}.fa.gz
    uri: /home/ubuntu/ancal_inputs/Homo_sapiens_assembly38.fasta
    access: local

  gene_annotation:
    name: GENCODE basic annotation
    version: v50
    uri: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/gencode.v50.basic.annotation.gtf.gz
    access: stream_filter   # keep MANE Select CDS rows only

  alphamissense:
    name: AlphaMissense hg38 precomputed missense predictions
    # Local copy of the URL below (release 2023-08-03, sha256 0516cfd7...).
    # Remote: https://storage.googleapis.com/dm_alphamissense/AlphaMissense_hg38.tsv.gz
    uri: /home/ubuntu/ancal_inputs/AlphaMissense_hg38.tsv.gz
    access: stream_filter   # about 640 MB streamed; only in-scope rows kept
    use: protein-to-genomic coordinate lookup only (AlphaMissense is a component of AVI; see leakage notes)

  clinvar:
    name: ClinVar GRCh38 VCF
    # "latest" is read only to learn its ##fileDate. Data is then read from the dated file,
    # so the release is fixed even if the weekly file is replaced mid-run.
    # Local copy: ##fileDate=2026-09-28 (the last smoke run used 20261004, D-051).
    # Remote: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz
    uri: /home/ubuntu/ancal_inputs/clinvar_20260928.vcf.gz
    release: "20260928"      # pinned to the local file's ##fileDate
    dated_uris:              # tried in order; archive_2.0 is the permanent location
      - https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar_{date}.vcf.gz
      - https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/weekly/clinvar_{date}.vcf.gz
      - https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/archive_2.0/{year}/clinvar_{date}.vcf.gz
    index_suffix: .tbi
    access: remote_tabix     # ClinVar names chromosomes 1..22,X; renamed to chr1.. on extraction

  mavedb:
    name: MaveDB API
    uri: https://api.mavedb.org/api/v1
    access: api

  uniprot:
    name: UniProt REST (accession -> primary gene name)
    uri: https://rest.uniprot.org/uniprotkb/accessions
    access: api
    use: resolves MaveDB target genes that carry only a UniProt accession (Stage 5)

  cadd:
    name: CADD v1.7 GRCh38 SNVs
    uri: https://kircherlab.bihealth.org/download/CADD/v1.7/GRCh38/whole_genome_SNVs.tsv.gz
    index_suffix: .tbi
    access: remote_tabix
    used_in: deliverable 2 only (the comparator is not run in deliverable 1)

  avi:
    name: AlphaGenome Atlas - AlphaGenome Variant Impact (AVI)
    # Static download (bgzipped TSV + tabix index, all hg38 SNVs) from
    # https://deepmind.google.com/science/alphagenome/downloads (Google sign-in). Two scores per
    # variant: raw (about -1.3 to 4.0) and PHRED (0 to about 80; 20 = top 1% genome-wide).
    # avi_scores_snvs_tabix.zip (88,473,344,811 bytes) downloaded 2026-10-14 and unpacked here.
    # Columns: #CHROM POS REF ALT raw_score PHRED (chr-prefixed, chr1-22, X, Y).
    uri: /scratch/data/alphagenome_avi/alphagenome_variant_impact_score_snvs.tsv.gz
    format: tsv          # bgzipped, tabix-indexed (.tbi beside it): read by region
    score_field: raw_score   # PHRED is a rank transform of raw_score (D-056)
    direction: higher_is_more_damaging   # Atlas paper Fig. 1C and Ensembl VEP docs; Stage 8 re-checks
    # Optional. Column names, if they are not CHROM/POS/REF/ALT (any case):
    # columns: {chrom: chromosome, pos: position, ref: ref_allele, alt: alt_allele, transcript: transcript_id}
    # damaging_threshold: 0.5    # only if the Atlas defines one (Step 31)
    index_suffix: .tbi   # tsv/vcf only: used for region access when <uri><suffix> exists
    access: local_tabix    # local file + .tbi; read by region
